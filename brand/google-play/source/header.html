<!doctype html>
<!-- Google Play developer page header. 2048x1152 CSS px, captured at scale 2 => 4096x2304.
     The background lives in a "scene" laid out in the source image's own pixels (1672x941, 16:9 = no crop),
     so the laptop / mug logos are positioned in source coordinates and scale with it. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=block" rel="stylesheet">
<style>
  :root { --ink:#3d2a1c; --soft:#5b4636; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:2048px; height:1152px; overflow:hidden; }
  body { position:relative; background:#f3e6ea; font-family:"Nunito", sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }

  .scene {
    position:absolute; left:0; top:0; width:1672px; height:941px;
    background:url(header-bg.png) 0 0 / 100% 100% no-repeat;
    transform-origin:0 0; transform:scale(1.224880);
  }
  .scene svg { position:absolute; overflow:visible; }
  /* laptop lid: flat plane mapped onto the lid quad via matrix3d (set by script) */
  .lid { position:absolute; left:0; top:0; width:1150px; height:1000px; transform-origin:0 0; }
  .lid svg { left:50%; top:50%; height:250px; width:auto; aspect-ratio:987/1026; transform:translate(-50%,-50%);
             color:#F0EEE9; opacity:.92; filter:drop-shadow(0 0 10px rgba(255,255,255,.55)) blur(.6px); }
  /* mug: printed on the front of the cup */
  .mug { left:793px; top:704px; height:36px; width:auto; aspect-ratio:987/1026; transform:translate(-50%,-50%);
          color:#5b4636; opacity:.85; mix-blend-mode:multiply; filter:blur(.25px); }

  /* content sits in the open sky of the window (window centre ~ source x 625, nudged right to clear the leaves) */
  .veil {
    position:absolute; inset:0;
    background:rgba(255,249,244,.5);
    backdrop-filter:blur(4px);
    -webkit-mask-image:radial-gradient(ellipse 22% 24% at 37.6% 48%, #000 40%, transparent 100%);
            mask-image:radial-gradient(ellipse 22% 24% at 37.6% 48%, #000 40%, transparent 100%);
  }
  .stack {
    position:absolute; left:37.6%; top:48%; transform:translate(-50%,-50%) scale(.78);
    display:flex; flex-direction:column; align-items:center; text-align:center; white-space:nowrap;
  }
  .brand { display:flex; align-items:center; gap:34px; }
  .owl { height:190px; width:auto; aspect-ratio:987/1026; color:var(--ink); display:block; }
  .word { font-family:"Fredoka", sans-serif; font-weight:600; font-size:120px; line-height:1; letter-spacing:-.005em; }
  .tag { font-family:"Fredoka", sans-serif; font-weight:500; font-size:25px; letter-spacing:.26em; margin-top:18px; color:var(--soft); padding-left:.26em; }
  .rule { width:120px; height:2px; background:rgba(61,42,28,.3); border-radius:1px; margin:40px 0 30px; }
  .lead { font-weight:700; font-size:36px; line-height:1.36; }
  .points { margin-top:16px; font-weight:600; font-size:28px; color:var(--soft); }
</style></head>

  <script>
  // Map the flat lid plane onto the laptop lid's corners in source px.
  const LID = { tl:[1111,512], tr:[1360,517], bl:[1030,753], br:[1293,748] };
  function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]];}
  function mm(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let s=0;for(let k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s;}return c;}
  function mv(m,v){return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]];}
  function basis(p){const m=[p[0][0],p[1][0],p[2][0],p[0][1],p[1][1],p[2][1],1,1,1];const v=mv(adj(m),[p[3][0],p[3][1],1]);return mm(m,[v[0],0,0,0,v[1],0,0,0,v[2]]);}
  const W=1150,H=1000;
  const s=basis([[0,0],[W,0],[0,H],[W,H]]), d=basis([LID.tl,LID.tr,LID.bl,LID.br]);
  let t=mm(d,adj(s)); t=t.map(x=>x/t[8]);
  document.getElementById("lid").style.transform=`matrix3d(${t[0]},${t[3]},0,${t[6]},${t[1]},${t[4]},0,${t[7]},0,0,1,0,${t[2]},${t[5]},0,1)`;
  </script>
